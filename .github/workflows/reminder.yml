name: Morning reminder

on:
  schedule:
    # 7:45 a.m. New York time all year: one of these is 7:45 in summer, the other in winter.
    - cron: '45 11 * * *'
    - cron: '45 12 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: Send a test reminder now
        type: boolean
        default: true

permissions:
  contents: write # only for the monthly keepalive commit

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Is it about 7 a.m. in New York?
        id: gate
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "07" ]; then
            echo "send=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Not 7 a.m. in New York (it's ${hour}:xx); the other schedule covers today." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.send == 'yes'
        with:
          python-version: '3.12'
      - name: Send the reminder
        if: steps.gate.outputs.send == 'yes'
        env:
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          pip install -q pywebpush==2.0.3
          python scripts/notify_push.py ${{ inputs.test && '--test' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
      # GitHub turns off scheduled workflows after 60 days without a commit.
      - name: Monthly keepalive
        if: github.event_name == 'schedule' && steps.gate.outputs.send == 'yes'
        run: |
          [ "$(TZ=America/New_York date +%d)" = "01" ] || exit 0
          date -u +%Y-%m-%dT%H:%MZ > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keep the morning reminder schedule active"
          git push
